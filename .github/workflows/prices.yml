name: Daily price snapshot

on:
  schedule:
    # Cardmarket regenerates price_guide_22.json around 02:45 Europe/Berlin (observed 02:42 and
    # 02:48 on separate days). These two entries are 03:00 Berlin either side of DST, ~15 minutes
    # after the drop.
    #
    # 🪤 There is deliberately NO gate job checking the clock. sweep.py compares the file's own
    # `createdAt` against the published snapshot's `source_created_at` and exits 100 when nothing
    # has changed — so whichever cron lands before the nightly drop simply no-ops, and a drop that
    # runs late is still picked up by the next day's first cron. Guessing a schedule was the
    # fragile half of the old design; asking the data is not.
    - cron: "0 1 * * *"   # 03:00 Berlin while CEST (UTC+2)
    - cron: "0 2 * * *"   # 03:00 Berlin while CET  (UTC+1)
  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if Cardmarket's data has not changed (use after editing cardmarket_links.json or sweep.py)"
        type: boolean
        default: false

concurrency:
  group: prices
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No API key and no quota: the three Cardmarket Data Tables exports are public static
      # files. The RapidAPI subscription this pipeline used to depend on is no longer involved.
      #
      # 🪤 The unchanged-data check keys on CARDMARKET's stamp, so it cannot see that OUR inputs
      # changed. After editing cardmarket_links.json, sweep.py or rune_pid_overrides.json the run
      # would no-op for the rest of the day and the fix would sit unpublished — which is exactly
      # what happened on 2026-07-31. Tick `force` on a manual run to override it.
      - name: Build the snapshot
        id: sweep
        run: |
          set +e
          python sweep.py --assets . --out out/prices.json ${{ inputs.force && '--force' || '' }}
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 100 ]; then
            echo "Cardmarket data unchanged — leaving the live snapshot as it is."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            exit $code
          fi

      - if: steps.sweep.outputs.published == 'true'
        uses: actions/configure-pages@v5

      - if: steps.sweep.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deploy
        if: steps.sweep.outputs.published == 'true'
        uses: actions/deploy-pages@v4
